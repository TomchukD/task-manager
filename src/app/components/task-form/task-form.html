<div class="task-form">
  <header class="task-form__header">
    <p class="task-form__eyebrow">Workspace · New task</p>
    <h1>Create a task.</h1>
    <p class="task-form__lead">Give it a title, a stage, and enough context to start moving.</p>
  </header>

  <div class="task-form__body" [formGroup]="taskForm">
    <div class="task-form__main">
      <label class="field-label" for="task-title">Title</label>
      <input
        id="task-title"
        class="title-input"
        formControlName="title"
        pInputText
        placeholder="What needs to be done?"
      />

      <label class="field-label" for="task-description">Description</label>
      <textarea
        id="task-description"
        class="description-input"
        formControlName="description"
        pTextarea
        placeholder="Add context, links, or notes for whoever picks this up..."
      ></textarea>
    </div>

    <aside class="task-form__meta" [attr.data-status]="taskForm.controls.status.value">
      <p class="meta-kicker">Details</p>

      <div class="meta-field" [attr.data-status]="taskForm.controls.status.value">
        <label class="field-label" for="task-status">Status</label>
        <p-select
          inputId="task-status"
          formControlName="status"
          [options]="statusOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Select status"
          appendTo="body"
          panelStyleClass="task-form-overlay"
          styleClass="meta-control"
        />
      </div>

      <div class="meta-field" [attr.data-priority]="taskForm.controls.priority.value">
        <label class="field-label" for="task-priority">Priority</label>
        <p-select
          inputId="task-priority"
          formControlName="priority"
          [options]="priorityOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Select priority"
          appendTo="body"
          panelStyleClass="task-form-overlay"
          styleClass="meta-control"
        />
      </div>

      <div class="meta-field">
        <label class="field-label" for="task-assignee">Assignee</label>
        <p-select
          inputId="task-assignee"
          formControlName="assignee"
          [options]="this.config.data.assignee"
          placeholder="Select assignee"
          appendTo="body"
          panelStyleClass="task-form-overlay"
          styleClass="meta-control"
        />
      </div>

      <div class="meta-field">
        <label class="field-label" for="task-deadline">Deadline</label>
        <p-datePicker
          inputId="task-deadline"
          formControlName="deadline"
          placeholder="Select date"
          dateFormat="M d, yy"
          [showIcon]="true"
          appendTo="body"
          panelStyleClass="task-form-overlay"
          styleClass="meta-control"
        />
      </div>
    </aside>
  </div>

  <footer class="task-form__footer">
    <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="close()" />
    <p-button label="Create task" icon="pi pi-plus" [disabled]="taskForm.invalid" />
  </footer>
</div>
