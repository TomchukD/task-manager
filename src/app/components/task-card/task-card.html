@if (data) {
  <p-card>
    <div class="flex flex-col gap-3">
      <div class="flex items-start justify-between gap-3">
        {{ data.title }}
      </div>
      <p-tag [value]="data.priority" />
    </div>
    <!--    todo  transform to CamlCase Name -->
    <p-avatar [label]="data.assignee" shape="circle" />
  </p-card>
}
