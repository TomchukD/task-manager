@if (data) {
  <article class="task-card">
    <header class="task-card__meta">
      <span class="priority" [class]="'priority priority--' + data.priority">
        <span class="priority__mark" aria-hidden="true"></span>
        {{ data.priority }}
      </span>
      <span class="task-id">#{{ data.id }}</span>
    </header>

    <div class="task-card__content">
      <h3>{{ data.title }}</h3>
      @if (data.description) {
        <p>{{ data.description }}</p>
      }
    </div>

    <footer class="task-card__footer">
      <div class="assignee" [attr.title]="'Assigned to ' + data.assignee">
        <p-avatar
          [label]="data.assignee | initials"
          [attr.aria-label]="'Assigned to ' + data.assignee"
          shape="circle"
        />
        <span>{{ data.assignee }}</span>
      </div>

      @if (data.deadline) {
        <div class="deadline" title="Deadline">
          <span class="deadline__mark" aria-hidden="true"></span>
          <time [attr.datetime]="data.deadline">{{ data.deadline | date: 'MMM d' }}</time>
        </div>
      }
    </footer>
  </article>
}
