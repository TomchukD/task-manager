<div class="grid grid-cols-3 gap-4" cdkDropListGroup>
  <div
    id="todo"
    cdkDropList
    [cdkDropListData]="todo"
    (cdkDropListDropped)="drop($event)"
    class="min-h-[300px] rounded-lg border border-neutral-400 bg-neutral-100 p-3"
  >
    @for (item of todo; track item.id) {
      <tm-task-card [data]="item" cdkDrag />
    }
  </div>

  <div
    id="in_progress"
    cdkDropList
    [cdkDropListData]="inProgress"
    (cdkDropListDropped)="drop($event)"
    class="min-h-[300px] rounded-lg border border-neutral-400 bg-neutral-100 p-3"
  >
    @for (item of inProgress; track item.id) {
      <tm-task-card [data]="item" cdkDrag />
    }
  </div>

  <div
    id="done"
    cdkDropList
    [cdkDropListData]="done"
    (cdkDropListDropped)="drop($event)"
    class="min-h-[300px] rounded-lg border border-neutral-400 bg-neutral-100 p-3"
  >
    @for (item of done; track item.id) {
      <tm-task-card [data]="item" cdkDrag />
    }
  </div>
</div>
